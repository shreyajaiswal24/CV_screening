# Render deployment. Create a Web Service from this repo and Render reads this.
#
# The free tier sleeps after ~15 minutes idle, so the first request after a
# quiet period takes ~30 seconds to wake. Mention that if you share the link.
services:
  - type: web
    name: cv-screening
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn screening.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set this in the Render dashboard, never in the repo
      - key: DEMO_MODE
        value: "1"           # forces dry-run email - a public URL must not send mail
      - key: PYTHON_VERSION
        value: "3.11"
