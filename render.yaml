# Render deployment. New + -> Blueprint, point it at this repo.
#
# There is no login: anyone with the URL can use the app. That is deliberate,
# so an evaluator can try it without credentials. Two things bound the risk of
# an open instance that sends mail from the owner's account:
#   - sending must be turned on explicitly with ALLOW_EMAIL=1
#   - MAX_SENDS_PER_HOUR caps how many invitations one instance will send
#
# The free tier sleeps after ~15 minutes idle; the first request then takes
# about 30 seconds to wake.
services:
  - type: web
    name: cv-screening
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn screening.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set in the Render dashboard, never committed
      - key: ALLOW_EMAIL
        value: "1"           # remove this and the app drafts but never sends
      - key: MAX_SENDS_PER_HOUR
        value: "10"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
