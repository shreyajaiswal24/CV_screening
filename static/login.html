<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Screening — Sign in</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f6f7f9;color:#12151a;
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .box{background:#fff;border:1px solid #e3e6ea;border-radius:14px;padding:32px;width:min(380px,90vw)}
  h1{font-size:19px;margin:0 0 6px}
  p{color:#5f6875;font-size:13.5px;margin:0 0 20px}
  input{width:100%;padding:11px 13px;border:1px solid #e3e6ea;border-radius:9px;
        font:inherit;font-size:15px;box-sizing:border-box}
  button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:9px;
         background:#1c4fd8;color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  .err{color:#a52034;font-size:13px;margin-top:10px;min-height:18px}
</style></head>
<body>
  <div class="box">
    <h1>CV Screening</h1>
    <p>This app can send email from the owner's account, so it's password protected.</p>
    <input type="password" id="pw" placeholder="Password" autofocus>
    <button id="go">Sign in</button>
    <div class="err" id="err"></div>
  </div>
<script>
  const go = async () => {
    const r = await fetch('/api/login', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: document.getElementById('pw').value})});
    if (r.ok) location.href = '/';
    else document.getElementById('err').textContent = 'That password is not correct.';
  };
  document.getElementById('go').onclick = go;
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key==='Enter') go(); });
</script>
</body></html>
